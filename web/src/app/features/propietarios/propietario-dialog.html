<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo Propietario' : 'Editar Propietario' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Nombre Completo</mat-label>
      <input matInput formControlName="nombre" />
    </mat-form-field>
    
    <mat-form-field appearance="outline">
      <mat-label>Teléfono</mat-label>
      <input matInput formControlName="telefono" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email (opcional)</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>ID Usuario {{ data.mode === 'create' ? 'Creación' : 'Edición' }}</mat-label>
      <input matInput formControlName="id_usuario_auditoria" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Guardar</button>
</mat-dialog-actions>
