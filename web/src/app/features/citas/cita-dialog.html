<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nueva cita' : 'Editar cita' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>ID Mascota</mat-label>
      <input matInput formControlName="id_mascota" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>ID Usuario agenda</mat-label>
      <input matInput formControlName="id_usuario_agenda" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Motivo</mat-label>
      <input matInput formControlName="motivo" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Costo</mat-label>
      <input matInput type="number" formControlName="costo" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Lugar (opcional)</mat-label>
      <input matInput formControlName="lugar" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Estado</mat-label>
      <mat-select formControlName="estado">
        <mat-option value="pendiente">Pendiente</mat-option>
        <mat-option value="realizada">Realizada</mat-option>
        <mat-option value="cancelada">Cancelada</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Guardar</button>
</mat-dialog-actions>
