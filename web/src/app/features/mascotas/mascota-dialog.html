<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nueva Mascota' : 'Editar Mascota' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Nombre de la Mascota</mat-label>
      <input matInput formControlName="nombre" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>ID Propietario (UUID)</mat-label>
      <input matInput formControlName="id_propietario" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Especie / Tipo</mat-label>
      <input matInput formControlName="tipo_mascota" placeholder="Ej. Perro, Gato" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Raza (opcional)</mat-label>
      <input matInput formControlName="raza" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Edad</mat-label>
      <input matInput type="number" formControlName="edad" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>ID Usuario {{ data.mode === 'create' ? 'Creación' : 'Edición' }}</mat-label>
      <input matInput formControlName="id_usuario_auditoria" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Guardar</button>
</mat-dialog-actions>
