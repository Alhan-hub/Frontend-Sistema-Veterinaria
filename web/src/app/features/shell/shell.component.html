<mat-sidenav-container class="shell-container">
  <mat-sidenav #sidenav mode="side" opened [class.collapsed]="isCollapsed" class="sidebar mat-elevation-z4">
    <div class="sidebar-header">
      <mat-icon class="logo-icon">pets</mat-icon>
      <span class="app-title" *ngIf="!isCollapsed">VetManager</span>
    </div>

    <mat-nav-list>
      <a mat-list-item *ngFor="let item of entities" 
         [routerLink]="item.path" 
         routerLinkActive="active-link"
         [matTooltip]="isCollapsed ? item.label : ''"
         matTooltipPosition="right">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle *ngIf="!isCollapsed">{{ item.label }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <mat-toolbar color="primary" class="header mat-elevation-z4">
      <button mat-icon-button (click)="toggleSidebar()">
        <mat-icon>{{ isCollapsed ? 'menu' : 'menu_open' }}</mat-icon>
      </button>
      
      <span class="spacer"></span>

      <div class="audit-selector">
        <mat-form-field appearance="outline" class="user-select">
          <mat-label>Usuario Auditoría</mat-label>
          <mat-select [(value)]="selectedUserId" (selectionChange)="updateAuditUser()">
            <mat-option *ngFor="let user of users" [value]="user.id">
              {{ user.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="user-info-menu" mat-menu-item disabled>
          <span>Richard Rendón Hoyos</span>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar Sesión</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="page-body">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
