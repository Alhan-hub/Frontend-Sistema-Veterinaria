<mat-sidenav-container
  #sidenavShell="matSidenavContainer"
  class="shell"
  autosize
>
  <mat-sidenav
    mode="side"
    opened
    class="nav-rail"
    [class.collapsed]="sidebarCollapsed()"
  >
    <div class="nav-brand">
      <div class="nav-brand__mark">
        <mat-icon class="nav-brand__icon">pets</mat-icon>
      </div>
      <div class="nav-brand__text" *ngIf="!sidebarCollapsed()">
        <span class="nav-brand__title">PetCare</span>
        <span class="nav-brand__sub">Sistema veterinario</span>
      </div>
    </div>

    <mat-nav-list class="nav-list">
      <a mat-list-item
         class="nav-item"
         *ngFor="let item of nav"
         [routerLink]="item.path"
         routerLinkActive="active-link"
         [matTooltip]="sidebarCollapsed() ? item.label : ''"
         matTooltipPosition="right"
         [matTooltipDisabled]="!sidebarCollapsed()">
        <mat-icon matListItemIcon class="nav-item__icon">{{ item.icon }}</mat-icon>
        <span matListItemTitle class="nav-label">{{ item.label }}</span>
      </a>
    </mat-nav-list>

    <div class="nav-footer">
      <button mat-stroked-button
              type="button"
              class="collapse-btn"
              (click)="toggleSidebar()"
              [matTooltip]="sidebarCollapsed() ? 'Expandir menú' : 'Colapsar menú'"
              matTooltipPosition="right">
        <mat-icon>{{ sidebarCollapsed() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
        <span *ngIf="!sidebarCollapsed()">Ocultar menú</span>
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-column">
    <mat-toolbar class="top-bar">
      <button mat-icon-button type="button" class="menu-toggle" (click)="toggleSidebar()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="title">PetCare</span>
      <span class="spacer"></span>
      <mat-select
        class="audit-select"
        [value]="audit.usuarioId()"
        (selectionChange)="audit.select($event.value)">
        <mat-option *ngFor="let u of usuarios()" [value]="u.id_usuario">
          {{ u.nombre_usuario }}
        </mat-option>
      </mat-select>
      <button mat-icon-button type="button" (click)="logout()" aria-label="Cerrar sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="content">
      <div class="content-inner">
        <router-outlet></router-outlet>
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
